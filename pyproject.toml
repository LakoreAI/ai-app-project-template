[project]
name = "ai-app-project-template"
version = "0.1.0"
description = "Template for AI's applications"
readme = "README.md"
authors = [
    { name = "Le Duc Minh", email = "minh.leduc.0210@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "colorlog>=6.12.0",
    "fastapi>=0.162.0",
    "openai>=3.37.0",
    "pydantic-settings>=2.16.1",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
datasources = [
    "psycopg[binary]>=3.3.6",
    "pymilvus>=3.0.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B024"]  # BaseModules is intentionally abstract-but-empty for now
